<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">اختلاف ماهانه تابش روی صفحه مهراس با PVGIS در سال ۲۰۲۳</title>
<desc id="desc">نمودار میله‌ای درصد اختلاف ماهانه. آستانه غربالگری مثبت و منفی ۲۰ درصد است؛ فوریه، ژوئیه و سپتامبر از آستانه عبور می‌کنند.</desc>
<rect width="1200" height="590" fill="#ffffff"/>
<text x="600" y="34" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="22" fill="#182230">اختلاف ماهانه POA مهراس با PVGIS-SARAH3 — ۲۰۲۳</text>
<text x="600" y="62" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="14" fill="#596579">Bias = (POA مهراس − POA مرجع) ÷ POA مرجع × ۱۰۰٪ | معیار غربالگری ±۲۰٪</text>
<line x1="70" y1="134.0" x2="1160" y2="134.0" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="70" y1="280" x2="1160" y2="280" stroke="#263238" stroke-width="2"/>
<line x1="70" y1="426.0" x2="1160" y2="426.0" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6"/>
<text x="62" y="139.0" text-anchor="end" font-family="Tahoma, sans-serif" font-size="13" fill="#b91c1c">+20%</text>
<text x="62" y="285" text-anchor="end" font-family="Tahoma, sans-serif" font-size="13" fill="#263238">0%</text>
<text x="62" y="431.0" text-anchor="end" font-family="Tahoma, sans-serif" font-size="13" fill="#b91c1c">−20%</text>
